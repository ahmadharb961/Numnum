# Builds the numnum iPhone app on Codemagic's Macs (no Mac needed) and sends it to TestFlight.
# One-time setup in Codemagic: connect the GitHub repo, then Team settings → Integrations →
# App Store Connect: add the API key (name it "numnum"). Signing is created automatically.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: numnum
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: me.numnum.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: Install packages
        script: npm ci --ignore-scripts
      - name: Copy the app shell and plugins into the iOS project
        script: npx cap sync ios
      - name: Use the signing profiles
        script: xcode-project use-profiles
      - name: Build number (Codemagic's counter, so every upload is higher than the last)
        script: sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Build the app
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Internal testers (your own team) get every build without Apple's beta review.
        # Set to true once Test Information is filled in, to also send builds to external testers.
        submit_to_testflight: false

  android-play:
    # Signed Android App Bundle (.aab) for Google Play. One-time setup in Codemagic: Team settings →
    # codemagic.yaml settings → Code signing identities → Android keystores: add the upload keystore
    # with the reference name "numnum_upload". Download the .aab from the build's artifacts and upload
    # it in Google Play Console (or connect Google Play publishing later).
    name: Android → Google Play (.aab)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      android_signing:
        - numnum_upload
      node: 22
      java: 21
    triggering:
      events: []
    scripts:
      - name: Install packages
        script: npm ci --ignore-scripts
      - name: Copy the app shell and plugins into the Android project
        script: npx cap sync android
      - name: Build the signed App Bundle
        working_directory: android
        script: ./gradlew bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

