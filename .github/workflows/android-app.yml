# Builds the numnum Android app (test APK) on GitHub's machines, which have the Android SDK.
# Download it from the run's "Artifacts" section and install it on an Android phone.
name: Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "app-shell/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm ci --ignore-scripts
      - name: Copy the app shell and plugins into the Android project
        run: npx cap sync android
      - name: Build the test APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: numnum-android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
